
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHREEJEE PUBLICATION - Student Login Portal</title>
    <link rel="stylesheet" href="styles3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-background">
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="brand-logo">
                        <i class="fas fa-graduation-cap"></i>
                        <h1>SHREEJEE PUBLICATION</h1>
                    </div>
                    <p class="tagline">Your Gateway to Academic Excellence</p>
                </div>

                <div class="login-form-container">
                    <form class="login-form" id="loginForm">
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    class="form-control" 
                                    placeholder="Enter your email"
                                    required
                                >
                            </div>
                            <span class="error-message" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-control" 
                                    placeholder="Enter your password"
                                    required
                                >
                                <button type="button" class="password-toggle" id="passwordToggle">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" id="passwordError"></span>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" id="rememberMe" name="rememberMe">
                                <span class="checkmark"></span>
                                Remember me
                            </label>
                            <a href="#" class="forgot-password" id="forgotPassword">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn--primary btn--full-width login-btn" id="loginBtn">
                            <span class="btn-text">Sign Up</span>
                            <div class="btn-loader hidden">
                                <i class="fas fa-spinner fa-spin"></i>
                            </div>
                        </button>
                    </form>

                    <div class="divider">
                        <span>or continue with</span>
                    </div>

                    <div class="social-login">
                        <button class="social-btn google-btn" id="googleBtn">
                            <i class="fab fa-google"></i>
                            <span>Google</span>
                        </button>
                        <button class="social-btn github-btn" id="githubBtn">
                            <i class="fab fa-github"></i>
                            <span>GitHub</span>
                        </button>
                        <button class="social-btn microsoft-btn" id="microsoftBtn">
                            <i class="fab fa-microsoft"></i>
                            <span>Microsoft</span>
                        </button>
                    </div>

                    <div class="signup-link">
                        <p>Don't have an account? <a href="#" id="signupLink">Sign up for free</a></p>
                    </div>
                </div>
            </div>
        </div>

        <footer class="login-footer">
            <p>&copy; 2025 SHREEJEE PUBLICATION. All rights reserved. | <a href="#" target="_blank">Privacy Policy</a> | <a href="#" target="_blank">Terms of Service</a></p>
        </footer>
    </div>

        <script src="app.js">
            // SHREEJEE PUBLICATION Login Page JavaScript

class LoginPage {
    constructor() {
        this.form = document.getElementById('loginForm');
        this.emailInput = document.getElementById('email');
        this.passwordInput = document.getElementById('password');
        this.passwordToggle = document.getElementById('passwordToggle');
        this.loginBtn = document.getElementById('loginBtn');
        this.rememberMe = document.getElementById('rememberMe');
        
        // Error elements
        this.emailError = document.getElementById('emailError');
        this.passwordError = document.getElementById('passwordError');
        
        // Social login buttons
        this.googleBtn = document.getElementById('googleBtn');
        this.githubBtn = document.getElementById('githubBtn');
        this.microsoftBtn = document.getElementById('microsoftBtn');
        
        // Other elements
        this.forgotPassword = document.getElementById('forgotPassword');
        this.signupLink = document.getElementById('signupLink');
        
        this.validationRules = {
            email: "Must be a valid email address",
            password: "Password must be at least 8 characters"
        };
        
        this.init();
    }
    
    init() {
        this.bindEvents();
        this.addInputAnimations();
        this.removeDefaultOutlines();
    }
    
    removeDefaultOutlines() {
        // Remove default browser outline and focus behavior that causes blue circles
        const style = document.createElement('style');
        style.textContent = `
            button, input, select, textarea, a {
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
            input, textarea {
                -webkit-user-select: text;
                -khtml-user-select: text;
                -moz-user-select: text;
                -ms-user-select: text;
                user-select: text;
            }
        `;
        document.head.appendChild(style);
    }
    
    bindEvents() {
        // Form submission
        this.form.addEventListener('submit', this.handleFormSubmit.bind(this));
        
        // Real-time validation
        this.emailInput.addEventListener('blur', () => this.validateEmail());
        this.emailInput.addEventListener('input', () => this.clearError('email'));
        this.passwordInput.addEventListener('blur', () => this.validatePassword());
        this.passwordInput.addEventListener('input', () => this.clearError('password'));
        
        // Password toggle
        this.passwordToggle.addEventListener('click', (e) => {
            e.preventDefault();
            this.togglePassword();
        });
        
        // Social login buttons
        this.googleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            this.handleSocialLogin('google');
        });
        this.githubBtn.addEventListener('click', (e) => {
            e.preventDefault();
            this.handleSocialLogin('github');
        });
        this.microsoftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            this.handleSocialLogin('microsoft');
        });
        
        // Other links
        this.forgotPassword.addEventListener('click', this.handleForgotPassword.bind(this));
        this.signupLink.addEventListener('click', this.handleSignupLink.bind(this));
        
        // Enter key handling
        this.emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.passwordInput.focus();
            }
        });
        
        this.passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.form.dispatchEvent(new Event('submit'));
            }
        });
    }
    
    addInputAnimations() {
        // Add focus animations
        const inputs = [this.emailInput, this.passwordInput];
        
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.classList.remove('focused');
                }
            });
        });
    }
    
    validateEmail() {
        const email = this.emailInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!email) {
            this.showError('email', 'Email address is required');
            return false;
        }
        
        if (!emailRegex.test(email)) {
            this.showError('email', this.validationRules.email);
            return false;
        }
        
        this.showSuccess('email');
        return true;
    }
    
    validatePassword() {
        const password = this.passwordInput.value;
        
        if (!password) {
            this.showError('password', 'Password is required');
            return false;
        }
        
        if (password.length < 8) {
            this.showError('password', this.validationRules.password);
            return false;
        }
        
        this.showSuccess('password');
        return true;
    }
    
    showError(field, message) {
        const input = field === 'email' ? this.emailInput : this.passwordInput;
        const errorElement = field === 'email' ? this.emailError : this.passwordError;
        
        input.classList.remove('success');
        input.classList.add('error');
        errorElement.textContent = message;
        errorElement.style.display = 'block';
        errorElement.style.opacity = '1';
    }
    
    showSuccess(field) {
        const input = field === 'email' ? this.emailInput : this.passwordInput;
        const errorElement = field === 'email' ? this.emailError : this.passwordError;
        
        input.classList.remove('error');
        input.classList.add('success');
        errorElement.textContent = '';
        errorElement.style.display = 'none';
        errorElement.style.opacity = '0';
    }
    
    clearError(field) {
        const input = field === 'email' ? this.emailInput : this.passwordInput;
        const errorElement = field === 'email' ? this.emailError : this.passwordError;
        
        if (input.classList.contains('error')) {
            input.classList.remove('error');
            errorElement.style.opacity = '0';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 200);
        }
    }
    
    togglePassword() {
        const type = this.passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        this.passwordInput.setAttribute('type', type);
        
        const icon = this.passwordToggle.querySelector('i');
        if (type === 'text') {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    async handleFormSubmit(e) {
        e.preventDefault();
        e.stopPropagation();
        
        // Validate all fields
        const isEmailValid = this.validateEmail();
        const isPasswordValid = this.validatePassword();
        
        if (!isEmailValid || !isPasswordValid) {
            this.shakeForm();
            return;
        }
        
        // Show loading state
        this.setLoadingState(true);
        
        try {
            // Simulate API call
            await this.simulateLogin();
            
            // Success feedback
            this.showSuccessMessage();
            
            // Simulate redirect after delay
            setTimeout(() => {
                alert('Login successful! Redirecting to dashboard...');
                // In a real app, you would redirect to the dashboard
                // window.location.href = '/dashboard';
            }, 1500);
            
        } catch (error) {
            this.showError('password', 'Invalid email or password. Please try again.');
            this.shakeForm();
        } finally {
            setTimeout(() => {
                this.setLoadingState(false);
            }, 1000);
        }
    }
    
    async simulateLogin() {
        // Simulate API call delay
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // Simulate success for demo (always succeed for better UX in demo)
        return { success: true };
    }
    
    setLoadingState(loading) {
        const btnText = this.loginBtn.querySelector('.btn-text');
        const btnLoader = this.loginBtn.querySelector('.btn-loader');
        
        if (loading) {
            this.loginBtn.classList.add('loading');
            this.loginBtn.disabled = true;
            btnText.style.opacity = '0';
            btnLoader.classList.remove('hidden');
        } else {
            this.loginBtn.classList.remove('loading');
            this.loginBtn.disabled = false;
            btnText.style.opacity = '1';
            btnLoader.classList.add('hidden');
        }
    }
    
    showSuccessMessage() {
        const originalText = this.loginBtn.querySelector('.btn-text');
        const originalBg = this.loginBtn.style.backgroundColor;
        
        originalText.textContent = 'Success!';
        this.loginBtn.style.backgroundColor = 'var(--color-success)';
        
        // Reset after delay
        setTimeout(() => {
            originalText.textContent = 'Sign Up';
            this.loginBtn.style.backgroundColor = originalBg;
        }, 3000);
    }
    
    shakeForm() {
        this.form.style.animation = 'shake 0.6s ease-in-out';
        setTimeout(() => {
            this.form.style.animation = '';
        }, 600);
    }
    
    async handleSocialLogin(provider) {
        const button = provider === 'google' ? this.googleBtn : 
                      provider === 'github' ? this.githubBtn : this.microsoftBtn;
        
        // Store original content
        const originalIcon = button.querySelector('i').className;
        const originalText = button.querySelector('span').textContent;
        
        // Add loading animation
        button.querySelector('i').className = 'fas fa-spinner fa-spin';
        button.querySelector('span').textContent = 'Connecting...';
        button.disabled = true;
        button.style.opacity = '0.7';
        
        try {
            // Simulate social login delay
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Show success state
            button.querySelector('i').className = 'fas fa-check';
            button.querySelector('span').textContent = 'Connected!';
            button.style.backgroundColor = 'var(--color-success)';
            button.style.color = 'white';
            
            setTimeout(() => {
                alert(`${provider.charAt(0).toUpperCase() + provider.slice(1)} login successful! Redirecting...`);
            }, 500);
            
        } catch (error) {
            alert('Social login failed. Please try again.');
        } finally {
            // Reset button after delay
            setTimeout(() => {
                button.querySelector('i').className = originalIcon;
                button.querySelector('span').textContent = originalText;
                button.disabled = false;
                button.style.opacity = '1';
                button.style.backgroundColor = '';
                button.style.color = '';
            }, 3000);
        }
    }
    
    handleForgotPassword(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const email = this.emailInput.value.trim();
        if (!email) {
            alert('Please enter your email address first to reset your password.');
            this.emailInput.focus();
            this.emailInput.style.animation = 'pulse 0.5s ease-in-out';
            setTimeout(() => {
                this.emailInput.style.animation = '';
            }, 500);
            return;
        }
        
        if (!this.validateEmail()) {
            alert('Please enter a valid email address.');
            this.emailInput.focus();
            return;
        }
        
        // Show success message
        const originalText = this.forgotPassword.textContent;
        this.forgotPassword.textContent = 'Instructions sent!';
        this.forgotPassword.style.color = 'var(--color-success)';
        
        setTimeout(() => {
            alert(`Password reset instructions have been sent to ${email}. Please check your inbox.`);
        }, 500);
        
        // Reset link text
        setTimeout(() => {
            this.forgotPassword.textContent = originalText;
            this.forgotPassword.style.color = '';
        }, 3000);
    }
    
    handleSignupLink(e) {
        e.preventDefault();
        e.stopPropagation();
        
        // Animate the link
        this.signupLink.style.transform = 'scale(0.95)';
        setTimeout(() => {
            this.signupLink.style.transform = 'scale(1)';
        }, 150);
        
        setTimeout(() => {
            alert('Redirecting to Sign Up page...\n\nIn a real application, this would navigate to the registration form where new students can create their SHREEJEE PUBLICATION accounts.');
        }, 200);
    }
}

// Inject necessary CSS animations
const animationCSS = `
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
    20%, 40%, 60%, 80% { transform: translateX(8px); }
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: var(--focus-ring); }
    50% { transform: scale(1.02); box-shadow: var(--focus-ring); }
    100% { transform: scale(1); box-shadow: var(--focus-ring); }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.input-wrapper.focused .input-icon {
    color: var(--color-primary) !important;
    transform: scale(1.05);
    transition: all 0.2s ease;
}

.form-control:valid:not(:placeholder-shown) {
    border-color: var(--color-success);
}

.social-btn {
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
}

.social-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    transition: all 0.4s ease;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.social-btn:hover::before {
    width: 300px;
    height: 300px;
}

.login-card {
    transition: transform 0.3s ease;
}

.social-btn:disabled {
    cursor: not-allowed;
}

.social-btn:disabled:hover {
    transform: none;
    box-shadow: none;
}

.social-btn:disabled:hover::before {
    width: 0;
    height: 0;
}

/* Enhanced error message styling */
.error-message {
    transition: all 0.3s ease;
    transform: translateY(-5px);
}

.error-message:empty {
    transform: translateY(0);
}

/* Button loading state improvements */
.btn.loading {
    pointer-events: none;
}

.btn-loader {
    color: var(--color-btn-primary-text);
}

/* Input focus enhancements */
.form-control:focus {
    transform: translateY(-1px);
    transition: all 0.2s ease;
}
`;

// Initialize the login page when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
    // Inject animations CSS
    const style = document.createElement('style');
    style.textContent = animationCSS;
    document.head.appendChild(style);
    
    // Initialize login page
    new LoginPage();
    
    // Add entrance animations for form elements
    setTimeout(() => {
        const elements = document.querySelectorAll('.form-group');
        elements.forEach((element, index) => {
            element.style.opacity = '0';
            element.style.transform = 'translateY(20px)';
            setTimeout(() => {
                element.style.animation = `fadeInUp 0.6s ease forwards`;
            }, index * 100);
        });
    }, 300);
});

// Theme handling
function initializeTheme() {
    const savedTheme = localStorage.getItem('shree-ojas-vidhyalaya-theme');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const theme = savedTheme || systemTheme;
    
    document.documentElement.setAttribute('data-color-scheme', theme);
}

// Listen for system theme changes
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if (!localStorage.getItem('shree-ojas-vidhyalaya-theme')) {
        document.documentElement.setAttribute('data-color-scheme', e.matches ? 'dark' : 'light');
    }
});

// Initialize theme
initializeTheme();
    </script>
</body>
</html>
